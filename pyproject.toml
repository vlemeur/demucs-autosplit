[project]
name = "demucs-autosplit"
version = "0.1.0"
description = "Batch stem separation using Demucs"
authors = [{ name = "Vincent LE MEUR", email = "vincent.le-meur@metroscope.tech" }]
requires-python = ">=3.11,<3.14"

dependencies = [
    # Intel macOS (x86_64): pin to a version that still has wheels for this platform
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchaudio==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Other platforms (Linux, Windows, macOS arm64): allow newer versions
    # Pin below 2.9 to avoid the new TorchCodec/FFmpeg runtime requirement.
    "torch==2.8.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchaudio==2.8.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "demucs>=4.0.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0,<2",
    "soundfile>=0.12.1",
    "madmom @ git+https://github.com/CPJKU/madmom.git",
    "streamlit>=1.36.0",
    "watchdog>=4.0.0",
    "plotly>=5.18.0",
]


[dependency-groups]
dev = [
    "pre-commit>=3.7.0",
    "ruff>=0.4.10",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

# ---------------------
# Ruff
# ---------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts"]
exclude = ["outputs", ".venv"]
fix = true

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
    "W",
]

[tool.ruff.lint.isort]
known-first-party = ["demucs_audiosplit"]

[tool.ruff.format]
quote-style = "double"
