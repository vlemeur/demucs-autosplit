[project]
name = "music-workbench"
version = "0.1.0"
description = "Music production toolkit: stem separation, chord detection, and MIDI harmony workspace"
authors = [{ name = "Vincent LE MEUR", email = "vincent.le-meur@metroscope.tech" }]
requires-python = ">=3.13,<3.14"

dependencies = [
    # The audio/MIDI stack is currently constrained to Python 3.13 by transitive wheels.
    # Intel macOS (x86_64): use last version with wheels for this platform
    "torch>=2.10.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchaudio>=2.10.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Other platforms (Linux, Windows, macOS arm64)
    "torch>=2.10.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchaudio>=2.10.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "demucs>=4.0.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0,<2",
    "soundfile>=0.12.1",
    "madmom @ git+https://github.com/CPJKU/madmom.git",
    "streamlit>=1.36.0",
    "watchdog>=4.0.0",
    "plotly>=5.18.0",
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
    "music21>=10.5.0",
    "verovio>=6.2.1",
    "chardet>=5,<6",
]


[dependency-groups]
dev = [
    "prek>=0.4.0,<0.5.0",
    "ruff>=0.4.10",
    "ty>=0.0.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

# ---------------------
# Ruff
# ---------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "scripts"]
exclude = ["outputs", ".venv"]
fix = true

# ---------------------
# Ty
# ---------------------
# Ty configuration is done via command line or discovered automatically.
# Run: ty check src/ scripts/
# See: https://github.com/astral-sh/ty for configuration options.

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
    "W",
]

[tool.ruff.lint.isort]
known-first-party = ["music_workbench", "demucs_audiosplit"]

[tool.ruff.format]
quote-style = "double"
